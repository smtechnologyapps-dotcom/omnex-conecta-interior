<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#0A1626" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="teal512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="blue512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg512)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(45, 212, 191, 0.3)" stroke-width="4" />
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="url(#beaconGlow)" />
  
  <!-- Outer Tactical Hexagon Shield -->
  <polygon points="256,64 410,144 410,320 256,448 102,320 102,144" 
           fill="rgba(10, 22, 38, 0.88)" 
           stroke="url(#teal512)" 
           stroke-width="10" />
           
  <!-- Inner Concentric Shield Structure -->
  <polygon points="256,104 374,166 374,302 256,400 138,302 138,166" 
           fill="none" 
           stroke="rgba(96, 165, 250, 0.45)" 
           stroke-width="4" 
           stroke-dasharray="14,10" />

  <!-- Tactical Reticle Coordinates -->
  <line x1="192" y1="256" x2="320" y2="256" stroke="rgba(45, 212, 191, 0.6)" stroke-width="4" />
  <line x1="256" y1="192" x2="256" y2="320" stroke="rgba(45, 212, 191, 0.6)" stroke-width="4" />
  
  <!-- Dynamic Pulse Rhythm Wave -->
  <path d="M150,268 L200,268 L228,214 L256,312 L284,236 L312,268 L362,268" 
        fill="none" 
        stroke="url(#blue512)" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- High Intensity Central Beacon -->
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" />
  <circle cx="256" cy="256" r="28" fill="none" stroke="#2DD4BF" stroke-width="4" opacity="0.9" />
  
  <!-- Tactical Wordmark Subtitle -->
  <text x="256" y="482" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Plus Jakarta Sans', sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="6" 
        fill="#2DD4BF">OMNEX CONECTA</text>
</svg>
