<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="100%" stop-color="#0A1626" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)" />
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="rgba(45, 212, 191, 0.25)" stroke-width="2" />
  
  <!-- Outer Tactical Hexagon Shield -->
  <polygon points="96,24 154,54 154,120 96,168 38,120 38,54" 
           fill="rgba(14, 28, 48, 0.85)" 
           stroke="url(#tealGrad)" 
           stroke-width="4" 
           filter="url(#glow)" />
           
  <!-- Inner Shield Accent -->
  <polygon points="96,40 140,64 140,114 96,150 52,114 52,64" 
           fill="none" 
           stroke="rgba(96, 165, 250, 0.4)" 
           stroke-width="2" 
           stroke-dasharray="6,4" />

  <!-- Tactical Crosshair & Signal Waves -->
  <path d="M72,96 L120,96 M96,72 L96,120" stroke="rgba(45, 212, 191, 0.5)" stroke-width="2" />
  
  <!-- Pulse Wave Line -->
  <path d="M58,102 L76,102 L86,82 L96,116 L106,90 L116,102 L134,102" 
        fill="none" 
        stroke="#2DD4BF" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Center Core Beacon -->
  <circle cx="96" cy="96" r="5" fill="#FFFFFF" />
  <circle cx="96" cy="96" r="10" fill="none" stroke="#60A5FA" stroke-width="2" opacity="0.8" />
</svg>
